apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: moliapi-grafana
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            # 保存仪表盘、用户和 Grafana 内部数据库。
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: moliapi-grafana
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: moliapi-grafana
    template:
        metadata:
            labels:
                app.kubernetes.io/name: moliapi-grafana
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 472
                runAsGroup: 472
                fsGroup: 472
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: grafana
                  # Grafana 仅用于指标展示，默认不通过 Ingress 对外暴露。
                  image: grafana/grafana:13.0.2
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 3000
                  env:
                      - name: GF_SECURITY_ADMIN_USER
                        value: admin
                      - name: GF_SECURITY_ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: moliapi-secrets
                                key: GF_SECURITY_ADMIN_PASSWORD
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: "1"
                          memory: 512Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: datasources
                        mountPath: /etc/grafana/provisioning/datasources
                        readOnly: true
                      - name: data
                        mountPath: /var/lib/grafana
                      - name: temp
                        mountPath: /tmp
            volumes:
                - name: datasources
                  configMap:
                      name: moliapi-grafana-datasources
                - name: data
                  persistentVolumeClaim:
                      claimName: moliapi-grafana
                - name: temp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: moliapi-grafana
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: moliapi-grafana
    ports:
        - name: http
          port: 3000
          targetPort: http