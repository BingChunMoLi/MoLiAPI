apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: moliapi-prometheus
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            # 默认保留 15 天指标，容量不足时应同时调整保留期。
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: moliapi-prometheus
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: moliapi-prometheus
    template:
        metadata:
            labels:
                app.kubernetes.io/name: moliapi-prometheus
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                fsGroup: 65534
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: prometheus
                  # Prometheus 是可选的集群内指标存储；已有托管监控时无需部署。
                  image: prom/prometheus:v3.12.0
                  imagePullPolicy: IfNotPresent
                  args:
                      - --config.file=/etc/prometheus/prometheus.yml
                      - --storage.tsdb.path=/prometheus
                      - --storage.tsdb.retention.time=15d
                      - --web.enable-lifecycle
                  ports:
                      - name: http
                        containerPort: 9090
                  readinessProbe:
                      httpGet:
                          path: /-/ready
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      httpGet:
                          path: /-/healthy
                          port: http
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: "1"
                          memory: 1Gi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                        readOnly: true
                      - name: data
                        mountPath: /prometheus
                      - name: temp
                        mountPath: /tmp
            volumes:
                - name: config
                  configMap:
                      name: moliapi-prometheus-config
                - name: data
                  persistentVolumeClaim:
                      claimName: moliapi-prometheus
                - name: temp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: moliapi-prometheus
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: moliapi-prometheus
    ports:
        - name: http
          port: 9090
          targetPort: http