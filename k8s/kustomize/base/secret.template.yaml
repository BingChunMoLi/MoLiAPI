# 示例文件不能直接用于生产。复制为 secret.yaml，替换全部示例值后单独应用；secret.yaml 已被 Git 忽略。
apiVersion: v1
kind: Secret
metadata:
    name: moliapi-secrets
    namespace: moliapi
type: Opaque
stringData:
    MYSQL_ROOT_PASSWORD: example-only-root-password
    MYSQL_PASSWORD: example-only-app-password
    REDIS_PASSWORD: example-only-redis-password
    GF_SECURITY_ADMIN_PASSWORD: example-only-grafana-password