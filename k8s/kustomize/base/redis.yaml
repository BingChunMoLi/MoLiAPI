apiVersion: v1
kind: Service
metadata:
    name: moliapi-redis
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: moliapi-redis
    ports:
        - name: redis
          port: 6379
          targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: moliapi-redis
spec:
    serviceName: moliapi-redis
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: moliapi-redis
    template:
        metadata:
            labels:
                app.kubernetes.io/name: moliapi-redis
        spec:
            securityContext:
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: redis
                  # Alpine 镜像较小；固定补丁版本避免无意升级。
                  image: redis:7.4.9-alpine
                  imagePullPolicy: IfNotPresent
                  command:
                      - sh
                      - -ec
                      - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
                  ports:
                      - name: redis
                        containerPort: 6379
                  env:
                      - name: REDIS_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: moliapi-secrets
                                key: REDIS_PASSWORD
                  startupProbe:
                      exec:
                          command:
                              - sh
                              - -ec
                              - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 30
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -ec
                              - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      exec:
                          command:
                              - sh
                              - -ec
                              - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: data
                        mountPath: /data
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      # AOF 持久化会持续增长，应结合实际缓存量调整。
                      storage: 2Gi