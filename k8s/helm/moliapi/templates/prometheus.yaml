{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "moliapi.fullname" . }}-prometheus-config
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
data:
    prometheus.yml: |
        {{- include "moliapi.prometheusConfig" . | nindent 8 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ include "moliapi.fullname" . }}-prometheus
    annotations:
        helm.sh/resource-policy: keep
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    accessModes: ["ReadWriteOnce"]
    {{- if .Values.prometheus.persistence.storageClass }}
    storageClassName: {{ .Values.prometheus.persistence.storageClass | quote }}
    {{- end }}
    resources:
        requests:
            storage: {{ .Values.prometheus.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "moliapi.fullname" . }}-prometheus
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-prometheus
    template:
        metadata:
            labels:
                app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-prometheus
                app.kubernetes.io/part-of: moliapi
            annotations:
                checksum/config: {{ include "moliapi.prometheusConfig" . | sha256sum }}
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                fsGroup: 65534
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: prometheus
                  image: {{ .Values.prometheus.image }}
                  imagePullPolicy: IfNotPresent
                  args:
                      - --config.file=/etc/prometheus/prometheus.yml
                      - --storage.tsdb.path=/prometheus
                      - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
                      - --web.enable-lifecycle
                  ports:
                      - name: http
                        containerPort: 9090
                  readinessProbe:
                      httpGet: {path: /-/ready, port: http}
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      httpGet: {path: /-/healthy, port: http}
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      {{- toYaml .Values.prometheus.resources | nindent 22 }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                  volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                        readOnly: true
                      - name: data
                        mountPath: /prometheus
                      - name: temp
                        mountPath: /tmp
            volumes:
                - name: config
                  configMap:
                      name: {{ include "moliapi.fullname" . }}-prometheus-config
                - name: data
                  persistentVolumeClaim:
                      claimName: {{ include "moliapi.fullname" . }}-prometheus
                - name: temp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "moliapi.fullname" . }}-prometheus
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-prometheus
    ports:
        - name: http
          port: 9090
          targetPort: http
{{- end }}