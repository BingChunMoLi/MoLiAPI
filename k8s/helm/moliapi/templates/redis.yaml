{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
    name: {{ include "moliapi.fullname" . }}-redis
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-redis
    ports:
        - name: redis
          port: 6379
          targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: {{ include "moliapi.fullname" . }}-redis
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    serviceName: {{ include "moliapi.fullname" . }}-redis
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-redis
    template:
        metadata:
            labels:
                app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-redis
                app.kubernetes.io/part-of: moliapi
        spec:
            securityContext:
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: redis
                  image: {{ .Values.redis.image }}
                  imagePullPolicy: IfNotPresent
                  command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
                  ports:
                      - name: redis
                        containerPort: 6379
                  env:
                      - name: REDIS_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "moliapi.secretName" . }}
                                key: REDIS_PASSWORD
                  startupProbe:
                      exec:
                          command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 30
                  readinessProbe:
                      exec:
                          command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      exec:
                          command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      {{- toYaml .Values.redis.resources | nindent 22 }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                  volumeMounts:
                      - name: data
                        mountPath: /data
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ["ReadWriteOnce"]
              {{- if .Values.redis.persistence.storageClass }}
              storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
              {{- end }}
              resources:
                  requests:
                      storage: {{ .Values.redis.persistence.size }}
{{- end }}