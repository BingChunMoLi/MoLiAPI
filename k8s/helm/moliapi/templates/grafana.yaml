{{- if .Values.grafana.enabled }}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "moliapi.fullname" . }}-grafana-datasources
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
data:
    datasources.yml: |
        {{- include "moliapi.grafanaDatasource" . | nindent 8 }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ include "moliapi.fullname" . }}-grafana
    annotations:
        helm.sh/resource-policy: keep
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    accessModes: ["ReadWriteOnce"]
    {{- if .Values.grafana.persistence.storageClass }}
    storageClassName: {{ .Values.grafana.persistence.storageClass | quote }}
    {{- end }}
    resources:
        requests:
            storage: {{ .Values.grafana.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "moliapi.fullname" . }}-grafana
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-grafana
    template:
        metadata:
            labels:
                app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-grafana
                app.kubernetes.io/part-of: moliapi
            {{- if .Values.prometheus.enabled }}
            annotations:
                checksum/datasource: {{ include "moliapi.grafanaDatasource" . | sha256sum }}
            {{- end }}
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 472
                runAsGroup: 472
                fsGroup: 472
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: grafana
                  image: {{ .Values.grafana.image }}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 3000
                  env:
                      - name: GF_SECURITY_ADMIN_USER
                        value: {{ .Values.grafana.adminUser | quote }}
                      - name: GF_SECURITY_ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "moliapi.secretName" . }}
                                key: GF_SECURITY_ADMIN_PASSWORD
                  readinessProbe:
                      httpGet: {path: /api/health, port: http}
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      httpGet: {path: /api/health, port: http}
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      {{- toYaml .Values.grafana.resources | nindent 22 }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                  volumeMounts:
                      {{- if .Values.prometheus.enabled }}
                      - name: datasources
                        mountPath: /etc/grafana/provisioning/datasources
                        readOnly: true
                      {{- end }}
                      - name: data
                        mountPath: /var/lib/grafana
                      - name: temp
                        mountPath: /tmp
            volumes:
                {{- if .Values.prometheus.enabled }}
                - name: datasources
                  configMap:
                      name: {{ include "moliapi.fullname" . }}-grafana-datasources
                {{- end }}
                - name: data
                  persistentVolumeClaim:
                      claimName: {{ include "moliapi.fullname" . }}-grafana
                - name: temp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "moliapi.fullname" . }}-grafana
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-grafana
    ports:
        - name: http
          port: 3000
          targetPort: http
{{- end }}