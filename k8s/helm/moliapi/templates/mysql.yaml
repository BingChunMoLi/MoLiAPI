{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
    name: {{ include "moliapi.fullname" . }}-mysql
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    clusterIP: None
    selector:
        app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-mysql
    ports:
        - name: mysql
          port: 3306
          targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: {{ include "moliapi.fullname" . }}-mysql
    labels:
        {{- include "moliapi.labels" . | nindent 8 }}
spec:
    serviceName: {{ include "moliapi.fullname" . }}-mysql
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-mysql
    template:
        metadata:
            labels:
                app.kubernetes.io/name: {{ include "moliapi.fullname" . }}-mysql
                app.kubernetes.io/part-of: moliapi
        spec:
            securityContext:
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: mysql
                  image: {{ .Values.mysql.image }}
                  imagePullPolicy: IfNotPresent
                  args:
                      - --innodb-buffer-pool-size=80M
                      - --character-set-server=utf8mb4
                      - --collation-server=utf8mb4_0900_ai_ci
                      - --default-time-zone=+08:00
                      - --lower-case-table-names=1
                      - --binlog-expire-logs-seconds=259200
                      - --max-binlog-size=1024M
                  ports:
                      - name: mysql
                        containerPort: 3306
                  env:
                      - name: MYSQL_DATABASE
                        value: {{ .Values.mysql.database | quote }}
                      - name: MYSQL_USER
                        value: {{ .Values.mysql.username | quote }}
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "moliapi.secretName" . }}
                                key: MYSQL_ROOT_PASSWORD
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "moliapi.secretName" . }}
                                key: MYSQL_PASSWORD
                  startupProbe:
                      exec:
                          command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
                  readinessProbe:
                      exec:
                          command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  livenessProbe:
                      exec:
                          command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      {{- toYaml .Values.mysql.resources | nindent 22 }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/mysql
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ["ReadWriteOnce"]
              {{- if .Values.mysql.persistence.storageClass }}
              storageClassName: {{ .Values.mysql.persistence.storageClass | quote }}
              {{- end }}
              resources:
                  requests:
                      storage: {{ .Values.mysql.persistence.size }}
{{- end }}